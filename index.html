<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>Моё расписание</title>
<style>
:root{--bg:#f4f6fb;--ink:#17233c;--muted:#71809b;--blue:#4263eb;--line:#e7ebf3;--card:#fff;--mint:#dff7ef}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}
header{background:linear-gradient(125deg,#14213d,#4263eb 62%,#38b6a2);color:#fff;padding:24px 18px 22px;border-radius:0 0 25px 25px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:23px;font-weight:800;letter-spacing:-.5px}.sub{font-size:13px;opacity:.82;margin-top:5px}
main{max-width:760px;margin:auto;padding:16px 14px 90px}.daytabs{display:flex;gap:7px;overflow:auto;padding:3px 0 13px;scrollbar-width:none}.daytabs button{border:0;border-radius:14px;background:#e8ecf6;color:#52617d;padding:11px 15px;font-weight:700;white-space:nowrap}.daytabs button.active{background:var(--blue);color:white;box-shadow:0 5px 15px #4263eb40}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:8px 1px 13px}.date{font-size:14px;color:var(--muted)}.actions{display:flex;gap:8px}
button{font:inherit;cursor:pointer}.small{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:9px 12px;font-weight:650}.primary{background:var(--blue);border:0;color:white;border-radius:12px;padding:11px 15px;font-weight:750}
.list{display:grid;gap:10px}.lesson{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:14px;display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center;box-shadow:0 4px 14px #24365b08}
.num{background:#eef2ff;color:#4263eb;border-radius:12px;padding:10px 5px;text-align:center;font-weight:800;font-size:15px}.time{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}.subject{font-weight:780;font-size:16px;margin:3px 0}.meta{font-size:13px;color:#64728b}.note{font-size:12px;color:#92702c;margin-top:4px}.edit{border:0;background:#f2f5fb;border-radius:10px;padding:9px;color:#52617d}
.empty{padding:34px 18px;text-align:center;background:#fff;border:1px dashed #cbd4e5;border-radius:17px;color:var(--muted)}
footer{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px max(14px,calc((100vw - 730px)/2));display:flex;gap:9px;justify-content:center}
footer button{flex:1;max-width:240px}
dialog{border:0;border-radius:22px;padding:0;width:min(500px,calc(100% - 28px));box-shadow:0 20px 70px #10204055}dialog::backdrop{background:#0e183b80;backdrop-filter:blur(3px)}.modal{padding:20px}.modal h2{margin:0 0 15px}.field{display:grid;gap:5px;margin:11px 0}.field label{font-size:12px;font-weight:750;color:var(--muted)}input,textarea{width:100%;border:1px solid #dce3ef;border-radius:11px;padding:11px;font:inherit;color:var(--ink);background:white}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:9px;margin-top:18px}.modal-actions button{flex:1}.hint{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}
@media(max-width:390px){.lesson{grid-template-columns:48px 1fr auto;gap:8px;padding:11px}.subject{font-size:14px}.time{font-size:11px}.daytabs button{padding:10px 12px}}
</style></head><body>
<header><div class="top"><div><div class="brand">Моё расписание</div><div class="sub">Занятия на неделю · изменения сохраняются автоматически</div></div><div style="font-size:30px">📚</div></div></header>
<main><nav class="daytabs" id="tabs"></nav><div class="toolbar"><div><div id="dayTitle" style="font-weight:800;font-size:19px"></div><div class="date" id="count"></div></div><div class="actions"><button class="small" id="reset" title="Вернуть исходное расписание">↺</button></div></div><section class="list" id="list"></section></main>
<footer><button class="small" id="export">Экспорт</button><button class="primary" id="add">＋ Добавить занятие</button><button class="small" id="importBtn">Импорт</button></footer>
<dialog id="dlg"><form class="modal" id="lessonForm"><h2 id="formTitle">Новое занятие</h2><input type="hidden" id="lessonId"><div class="field"><label>День недели</label><select id="day" style="width:100%;padding:11px;border:1px solid #dce3ef;border-radius:11px;font:inherit"></select></div><div class="grid2"><div class="field"><label>Номер урока</label><input id="number" placeholder="1"></div><div class="field"><label>Класс / группа</label><input id="className" placeholder="Например, 7а"></div></div><div class="field"><label>Предмет или запись</label><input id="subject" required placeholder="Например, Математика"></div><div class="grid2"><div class="field"><label>Начало</label><input id="start" type="time" required></div><div class="field"><label>Окончание</label><input id="end" type="time" required></div></div><div class="field"><label>Кабинет</label><input id="room" placeholder="Например, 215"></div><div class="field"><label>Примечание</label><textarea id="note" rows="2" placeholder="Необязательно"></textarea></div><div class="modal-actions"><button type="button" class="small" id="deleteBtn" style="display:none">Удалить</button><button type="button" class="small" id="cancel">Отмена</button><button type="submit" class="primary">Сохранить</button></div></form></dialog>
<input type="file" id="fileInput" accept="application/json" hidden>
<script>
const ORIGINAL=[{"day": "Понедельник", "lessons": [{"id": "0-0", "number": "1", "start": "08:55", "end": "09:30", "className": "11б", "subject": "Информатика", "room": "215", "note": ""}, {"id": "0-1", "number": "2", "start": "09:45", "end": "10:20", "className": "11б", "subject": "Информатика", "room": "215", "note": ""}, {"id": "0-2", "number": "3", "start": "10:30", "end": "11:05", "className": "5г", "subject": "Математика", "room": "209", "note": ""}, {"id": "0-3", "number": "4", "start": "11:15", "end": "11:50", "className": "11а", "subject": "Информатика", "room": "215", "note": ""}, {"id": "0-4", "number": "5", "start": "12:10", "end": "12:45", "className": "5е", "subject": "Математика", "room": "209", "note": ""}, {"id": "0-5", "number": "6", "start": "13:05", "end": "13:40", "className": "", "subject": "Разговоры о важном", "room": "213", "note": ""}, {"id": "0-6", "number": "7", "start": "13:55", "end": "14:30", "className": "6ж", "subject": "Математика", "room": "215б", "note": ""}, {"id": "0-7", "number": "8", "start": "14:40", "end": "15:15", "className": "8б", "subject": "Алгебра", "room": "204", "note": ""}, {"id": "0-8", "number": "9", "start": "15:25", "end": "16:00", "className": "8б", "subject": "Геометрия", "room": "204", "note": ""}, {"id": "0-9", "number": "12", "start": "17:35", "end": "18:10", "className": "", "subject": "Рома", "room": "215", "note": "Запись указана в исходном расписании без класса и предмета."}]}, {"day": "Вторник", "lessons": [{"id": "1-0", "number": "2", "start": "09:00", "end": "09:40", "className": "5е", "subject": "Математика", "room": "211", "note": ""}, {"id": "1-1", "number": "4", "start": "10:45", "end": "11:25", "className": "", "subject": "Алексей", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "1-2", "number": "5", "start": "11:35", "end": "12:15", "className": "5г", "subject": "Математика", "room": "209", "note": ""}, {"id": "1-3", "number": "6", "start": "12:35", "end": "13:15", "className": "", "subject": "Вероника", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "1-4", "number": "7", "start": "13:35", "end": "14:15", "className": "", "subject": "Платон", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "1-5", "number": "8", "start": "14:30", "end": "15:10", "className": "6ж", "subject": "Математика", "room": "209", "note": ""}, {"id": "1-6", "number": "9", "start": "15:20", "end": "16:00", "className": "", "subject": "Карина", "room": "215", "note": "Запись указана в исходном расписании как имя."}]}, {"day": "Среда", "lessons": [{"id": "2-0", "number": "1", "start": "08:00", "end": "08:40", "className": "11б", "subject": "Информатика", "room": "215", "note": ""}, {"id": "2-1", "number": "2", "start": "09:00", "end": "09:40", "className": "11б", "subject": "Информатика", "room": "215", "note": ""}, {"id": "2-2", "number": "4", "start": "10:45", "end": "11:25", "className": "5е", "subject": "Математика", "room": "209", "note": ""}, {"id": "2-3", "number": "5", "start": "11:35", "end": "12:15", "className": "5г", "subject": "Математика", "room": "209", "note": ""}, {"id": "2-4", "number": "6", "start": "12:35", "end": "13:15", "className": "", "subject": "Артём", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "2-5", "number": "7", "start": "13:35", "end": "14:15", "className": "6ж", "subject": "Математика", "room": "204", "note": ""}, {"id": "2-6", "number": "8", "start": "14:30", "end": "15:10", "className": "", "subject": "Давид", "room": "215", "note": "Запись указана в исходном расписании как имя."}, {"id": "2-7", "number": "10", "start": "16:10", "end": "16:50", "className": "", "subject": "Михаил", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "2-8", "number": "12", "start": "17:45", "end": "18:25", "className": "", "subject": "Рома", "room": "315", "note": "Запись указана в исходном расписании как имя."}]}, {"day": "Четверг", "lessons": [{"id": "3-0", "number": "2", "start": "09:00", "end": "09:40", "className": "", "subject": "Найденко", "room": "", "note": "В исходном расписании указано только имя; время взято из строки 2."}, {"id": "3-1", "number": "3", "start": "09:55", "end": "10:35", "className": "5е", "subject": "Математика", "room": "203", "note": ""}, {"id": "3-2", "number": "4", "start": "10:45", "end": "11:25", "className": "", "subject": "Алексей", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "3-3", "number": "5", "start": "11:35", "end": "12:15", "className": "5г", "subject": "Математика", "room": "211", "note": ""}, {"id": "3-4", "number": "6", "start": "12:35", "end": "13:15", "className": "", "subject": "Артём", "room": "315", "note": "Запись указана в исходном расписании как имя."}, {"id": "3-5", "number": "8", "start": "14:30", "end": "15:10", "className": "8б", "subject": "Технология/т.в.", "room": "209", "note": "Сокращение предмета сохранено по исходному расписанию."}, {"id": "3-6", "number": "9", "start": "15:20", "end": "16:00", "className": "", "subject": "Юля", "room": "215", "note": "Запись указана в исходном расписании как имя."}, {"id": "3-7", "number": "10", "start": "16:10", "end": "16:50", "className": "6ж", "subject": "Математика", "room": "209", "note": ""}, {"id": "3-8", "number": "11", "start": "17:00", "end": "17:40", "className": "8д", "subject": "Информатика", "room": "215", "note": ""}, {"id": "3-9", "number": "12", "start": "17:45", "end": "18:25", "className": "8е", "subject": "Информатика", "room": "215", "note": ""}]}, {"day": "Пятница", "lessons": [{"id": "4-0", "number": "1", "start": "08:00", "end": "08:40", "className": "5г", "subject": "Математика", "room": "313", "note": ""}, {"id": "4-1", "number": "2", "start": "09:00", "end": "09:40", "className": "", "subject": "Бендус", "room": "", "note": "В исходном расписании указано только имя; класс и кабинет не указаны."}, {"id": "4-2", "number": "3", "start": "09:55", "end": "10:35", "className": "5е", "subject": "Математика", "room": "209", "note": ""}, {"id": "4-3", "number": "6", "start": "12:35", "end": "13:15", "className": "6ж", "subject": "Математика", "room": "311", "note": ""}, {"id": "4-4", "number": "8", "start": "14:30", "end": "15:10", "className": "8б", "subject": "Алгебра", "room": "303", "note": ""}, {"id": "4-5", "number": "9", "start": "15:20", "end": "16:00", "className": "8б", "subject": "Геометрия", "room": "303", "note": ""}, {"id": "4-6", "number": "10", "start": "16:10", "end": "16:50", "className": "", "subject": "Михаил", "room": "215", "note": "Запись указана в исходном расписании как имя."}, {"id": "4-7", "number": "11", "start": "17:00", "end": "17:40", "className": "", "subject": "Карина", "room": "215", "note": "Запись указана в исходном расписании как имя."}]}];
const KEY='weekly-schedule-v1';
let schedule=load(),active=0;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(x)&&x.length===5)return x}catch(e){}return structuredClone(ORIGINAL)}
function save(){localStorage.setItem(KEY,JSON.stringify(schedule))}
const tabs=document.getElementById('tabs'),list=document.getElementById('list'),daySel=document.getElementById('day');
function init(){ORIGINAL.forEach((d,i)=>{let b=document.createElement('button');b.textContent=['ПН','ВТ','СР','ЧТ','ПТ'][i];b.onclick=()=>{active=i;render()};tabs.append(b);let o=document.createElement('option');o.value=i;o.textContent=d.day;daySel.append(o)});render()}
function render(){[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===active));document.getElementById('dayTitle').textContent=schedule[active].day;let arr=[...schedule[active].lessons].sort((a,b)=>a.start.localeCompare(b.start));document.getElementById('count').textContent=arr.length+' '+(arr.length===1?'запись':arr.length<5?'записи':'записей');list.innerHTML='';
if(!arr.length){list.innerHTML='<div class="empty">На этот день занятий пока нет.<br>Нажмите «Добавить занятие».</div>';return}
arr.forEach(x=>{let el=document.createElement('article');el.className='lesson';let meta=[x.className,x.room?'каб. '+x.room:''].filter(Boolean).join(' · ');el.innerHTML=`<div class="num">${esc(x.number||'—')}</div><div><div class="time">${esc(x.start)} — ${esc(x.end)}</div><div class="subject">${esc(x.subject)}</div><div class="meta">${esc(meta||'Без дополнительных данных')}</div>${x.note?`<div class="note">${esc(x.note)}</div>`:''}</div><button class="edit" aria-label="Редактировать">✎</button>`;el.querySelector('button').onclick=()=>edit(x.id);list.append(el)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function edit(id){let di=active,x=schedule[di].lessons.find(y=>y.id===id);if(!x)return;fillForm(x,di)}
function fillForm(x={},di=active){document.getElementById('formTitle').textContent=x.id?'Изменить занятие':'Новое занятие';document.getElementById('deleteBtn').style.display=x.id?'block':'none';document.getElementById('lessonId').value=x.id||'';daySel.value=di;['number','className','subject','start','end','room','note'].forEach(k=>document.getElementById(k).value=x[k]||'');document.getElementById('dlg').showModal()}
document.getElementById('add').onclick=()=>fillForm({},active);document.getElementById('cancel').onclick=()=>document.getElementById('dlg').close();
document.getElementById('lessonForm').onsubmit=e=>{e.preventDefault();let di=+daySel.value,id=document.getElementById('lessonId').value;let x={id:id||'u-'+Date.now(),number:v('number'),className:v('className'),subject:v('subject'),start:v('start'),end:v('end'),room:v('room'),note:v('note')};if(id){for(let d of schedule)d.lessons=d.lessons.filter(y=>y.id!==id)}schedule[di].lessons.push(x);save();active=di;render();document.getElementById('dlg').close()};
document.getElementById('deleteBtn').onclick=()=>{let id=document.getElementById('lessonId').value;if(id&&confirm('Удалить это занятие?')){for(let d of schedule)d.lessons=d.lessons.filter(x=>x.id!==id);save();render();document.getElementById('dlg').close()}};\nfunction v(k){return document.getElementById(k).value.trim()}
document.getElementById('reset').onclick=()=>{if(confirm('Вернуть исходное расписание? Все внесённые изменения будут заменены.')){schedule=structuredClone(ORIGINAL);save();render()}};
document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify(schedule,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='moe-raspisanie.json';a.click();URL.revokeObjectURL(a.href)};
document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x)||x.length!==5||!x.every(d=>Array.isArray(d.lessons)))throw Error();schedule=x;save();active=0;render();alert('Расписание импортировано')}catch(err){alert('Не удалось прочитать файл расписания')}e.target.value=''};
init();
</script></body></html>
